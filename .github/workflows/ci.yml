name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # Gate jobs must tolerate missing Actions secrets (soft-skip Firebase init).
  # Never inline NEXT_PUBLIC_* / API keys — ${{ secrets.* }} only.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # Install without lifecycle scripts and without CI secrets in scope
      # (react-doctor build-pipeline-secret-boundary).
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: React Doctor
        run: npm run doctor
      - name: Production build
        env:
          NEXT_PUBLIC_COOKIE_NAME: ${{ secrets.NEXT_PUBLIC_COOKIE_NAME }}
          NEXT_PUBLIC_FIREBASE_APIKEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_APIKEY }}
          NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTHDOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECTID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECTID }}
          NEXT_PUBLIC_FIREBASE_STORAGEBUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGEBUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID }}
          NEXT_PUBLIC_FIREBASE_APPID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENTID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENTID }}
          NEXT_PUBLIC_STRIPE_PRODUCT_NAME: ${{ secrets.NEXT_PUBLIC_STRIPE_PRODUCT_NAME }}
          NEXT_PUBLIC_CREDITS_PER_IMAGE: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_IMAGE }}
          NEXT_PUBLIC_CREDITS_PER_CHATGPT: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_CHATGPT }}
          NEXT_PUBLIC_CREDITS_PER_D_ID: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_D_ID }}
          NEXT_PUBLIC_CREDITS_PER_RUNWAY: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_RUNWAY }}
          NEXT_PUBLIC_CREDITS_PER_BRIA_IMAGE: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_BRIA_IMAGE }}
          NEXT_PUBLIC_CREDITS_PER_STABILITY_SD3_TURBO_IMAGE: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_STABILITY_SD3_TURBO_IMAGE }}
          NEXT_PUBLIC_CREDITS_PER_FLUX_SCHNELL: ${{ secrets.NEXT_PUBLIC_CREDITS_PER_FLUX_SCHNELL }}
        # Soft-skip Firebase client init when secrets are unset — do not re-inline values.
        run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
      - name: Firestore rules (emulator)
        run: npm run test:rules

  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run IOC scan
        run: |
          chmod +x scripts/malware-scan.sh
          ./scripts/malware-scan.sh
